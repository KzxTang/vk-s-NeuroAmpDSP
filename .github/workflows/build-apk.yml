name: Build NeuroAmp APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./app
        run: flutter pub get

      - name: Build APK (Debug)
        working-directory: ./app
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuroamp-debug-apk
          path: "app/build/**/outputs/**/*.apk"      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuroamp-debug-apk
          # 核心防爆改动：使用通配符。无论 Flutter 把 APK 藏在哪层目录，都能精准抓取，彻底避免找不到文件的报错
          path: app/build/**/outputs/**/*.apk        with:
          name: neuroamp-debug-apk
          # 核心防爆改动：使用通配符。无论 Flutter 把 APK 藏在哪层目录，都能精准抓取，彻底避免找不到文件的报错
          path: build/**/outputs/**/*.apk
