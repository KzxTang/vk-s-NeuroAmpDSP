name: Build NeuroAmp APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Debug)
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuroamp-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30      - name: Upload APK to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neuroamp-debug-apk
          path: app/android/build/app/outputs/apk/debug/app-debug.apk
          retention-days: 30      - name: Upload APK to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neuroamp-debug-apk
          path: app/android/build/app/outputs/apk/debug/app-debug.apk
          retention-days: 30      - name: Upload APK to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neuroamp-debug-apk
          path: app/android/build/app/outputs/apk/debug/app-debug.apk
          retention-days: 30          cd app/android
          flutter build apk --debug

      - name: Upload APK to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neuroamp-debug-apk
          path: app/android/build/app/outputs/apk/debug/app-debug.apk
          retention-days: 30
